<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Созвездие — конструктор компетенций будущего инженера</title>
<meta name="description" content="Квиз профориентации для 5–11 классов: 14 инженерных направлений, Hard и Soft skills, индивидуальный план развития, вузы и колледжи.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

:root{
  --paper:#F5F6FB; --paper-2:#FFFFFF; --paper-3:#ECEEF7; --ink:#171C33; --ink-2:#4B5473; --ink-3:#7C84A3;
  --line:#DCE0EE; --line-2:#C9CEE3; --accent:#E0731C; --accent-soft:#FFF1E4; --accent-ink:#8F4508;
  --blue:#2B3F8C; --blue-soft:#E7EBFA; --code-bg:#EEF0F8; --ok:#2E8B57; --ok-soft:#E4F5EA; --warn:#B7791F; --warn-soft:#FFF6DF;
  --f-display:'Unbounded',system-ui,sans-serif; --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sky-0:#070A1C; --sky-1:#0E1538; --sky-2:#182050; --sky-3:#232C63; --text:#F2F4FF; --muted:#A3ABCB; --solar:#FFB347; --ion:#5CE1FF; --okk:#7BE495;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1324; --paper-2:#171C33; --paper-3:#1D2340; --ink:#ECEFFF; --ink-2:#B3BAD6; --ink-3:#8A93B8;
    --line:#2A3150; --line-2:#3A4266; --accent:#FFB35C; --accent-soft:#332415; --accent-ink:#FFD39A;
    --blue:#9DB0FF; --blue-soft:#1C2445; --code-bg:#1A2040; --ok:#7BE495; --ok-soft:#173224; --warn:#F2C14E; --warn-soft:#3A2F12;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1324; --paper-2:#171C33; --paper-3:#1D2340; --ink:#ECEFFF; --ink-2:#B3BAD6; --ink-3:#8A93B8;
  --line:#2A3150; --line-2:#3A4266; --accent:#FFB35C; --accent-soft:#332415; --accent-ink:#FFD39A;
  --blue:#9DB0FF; --blue-soft:#1C2445; --code-bg:#1A2040; --ok:#7BE495; --ok-soft:#173224; --warn:#F2C14E; --warn-soft:#3A2F12;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
a{color:var(--blue)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ion);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
code,pre,.mono{font-family:var(--f-mono);font-size:.9em}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.modes{display:flex;gap:4px;background:var(--paper-3);padding:4px;border-radius:12px}
.modes button{border:0;background:transparent;color:var(--ink-2);padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.modes button.on{background:var(--paper-2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.top .who{font-size:13px;color:var(--ink-3)}

.layout{display:grid;grid-template-columns:430px minmax(0,1fr);min-height:calc(100vh - 57px)}
.layout.mode-proto,.layout.mode-web{grid-template-columns:1fr}
.layout.mode-proto .panel,.layout.mode-web .panel{display:none}
.layout.mode-doc{grid-template-columns:1fr}
.layout.mode-doc .stage{display:none}
.layout.mode-doc .panel{max-width:920px;margin:0 auto;width:100%}
.stage{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:var(--paper)}
.layout.mode-proto .stage,.layout.mode-web .stage{position:static;height:auto;min-height:calc(100vh - 57px)}
.stage-hint{margin:0;font-size:13px;color:var(--ink-3);text-align:center;max-width:360px}
.phone{width:392px;height:min(800px,calc(100vh - 130px));min-height:560px;border-radius:44px;background:#0B0E1E;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 0 0 2px #2A3150;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--sky-0);color:var(--text);font-family:var(--f-body);container-type:inline-size;container-name:app}
.layout.mode-web .stage{padding:14px 18px 70px}
.layout.mode-web .phone{width:100%;max-width:1220px;height:calc(100vh - 110px);min-height:640px;border-radius:22px;padding:0;box-shadow:0 20px 50px rgba(0,0,0,.3),inset 0 0 0 1px #2A3150}
.layout.mode-web .screen{border-radius:22px}
.layout.mode-web .stage-hint{max-width:700px}

.panel{border-left:1px solid var(--line);background:var(--paper-2);min-height:calc(100vh - 57px)}
.layout.mode-split .panel{height:calc(100vh - 57px);overflow:auto;position:sticky;top:57px}
.layout.mode-split .tabs{top:0}
.layout.mode-doc .panel{border-left:0}
.tabs{position:sticky;top:57px;z-index:20;display:flex;gap:2px;padding:10px 20px 0;background:var(--paper-2);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font-size:14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabpane{display:none;padding:22px 24px 60px;max-width:880px}
.tabpane.on{display:block}
.intro{background:var(--blue-soft);border-radius:14px;padding:16px 18px;margin-bottom:18px;font-size:14px;color:var(--ink-2)}
.intro strong{color:var(--ink)}
.intro p{margin:0 0 6px}
.intro p:last-child{margin:0}
.changes{background:var(--ok-soft);border-radius:14px;padding:14px 18px;margin-bottom:18px;font-size:14px;color:var(--ink-2)}
.changes strong{color:var(--ink)}
.changes ul{margin:6px 0 0;padding-left:18px}
.changes li{margin:3px 0}

.block{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--paper-2);scroll-margin-top:60px;transition:border-color .2s,box-shadow .2s}
.block.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.block>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;user-select:none}
.block>summary::-webkit-details-marker{display:none}
.block .num{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);min-width:26px}
.block .ttl{font-weight:700;font-size:15px;flex:1}
.block .scr{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--paper-3);color:var(--ink-2);white-space:nowrap}
.tag.now{background:var(--accent);color:#fff}
.block .chev{width:18px;height:18px;transition:transform .2s;color:var(--ink-3)}
.block[open] .chev{transform:rotate(180deg)}
.block .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:16px 0 8px}
.logic p{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.logic ul,.logic ol{margin:0 0 8px;padding-left:20px;font-size:14px;color:var(--ink-2)}
.logic li{margin:3px 0}
.logic strong{color:var(--ink)}
.formula{background:var(--code-bg);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap;color:var(--ink);margin:6px 0 10px;line-height:1.55;overflow-x:auto}
.prompt{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.prompt .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:700}
.prompt pre{margin:0;padding:12px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;max-height:380px;overflow:auto;background:var(--paper-2);color:var(--ink)}
.copy{border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer}
.copy:hover{background:var(--paper-3)}
.mini{font-size:12.5px;color:var(--ink-3)}

.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.tblwrap .tbl{margin:0}
.cov td{text-align:center;font-family:var(--f-mono);font-size:12px;padding:5px 4px}
.cov td.w2{background:var(--accent);color:#fff;font-weight:700}
.cov td.w1{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.cov th{text-align:center;padding:5px 4px}
.cov td.lbl{text-align:left;font-family:var(--f-body);font-size:12.5px;white-space:nowrap}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0 14px}
.kpi div{background:var(--paper-3);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700}
.kpi span{font-size:12px;color:var(--ink-3)}
.bar{height:8px;background:var(--paper-3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.okline{color:var(--ok);font-weight:700}
.failline{color:#C0392B;font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn2{border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn2.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}
.flow span{background:var(--paper-3);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
.flow em{color:var(--ink-3);font-style:normal}
.qlist li{margin:6px 0}
.q-e{background:var(--warn-soft);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 10px 10px 0;margin:6px 0;font-size:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.two-col>div{background:var(--paper-3);border-radius:12px;padding:12px 14px}
.two-col h4{font-size:13px;margin-bottom:6px}
.two-col ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.two-col li{margin:3px 0}
@media (max-width:700px){.two-col{grid-template-columns:1fr}}

/* ===== APP ===== */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.app canvas.stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app .view{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;padding:54px 20px 24px;-webkit-overflow-scrolling:touch}
.app .view::-webkit-scrollbar{width:0}
.app h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.app h2{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.25}
.app h3{font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.3;color:var(--solar)}
.app p{margin:0 0 10px;font-size:16px;line-height:1.5}
.app .muted{color:var(--muted)}
.app .small{font-size:13px}
.app .lead{font-size:17px}
.a-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 18px;border-radius:16px;border:0;font-family:var(--f-body);font-weight:700;font-size:17px;cursor:pointer;transition:transform .1s,filter .15s}
.a-btn:active{transform:scale(.98)}
.a-btn.pri{background:var(--solar);color:#1A1200}
.a-btn.pri:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.a-btn.sec{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.16)}
.a-btn.ghost{background:transparent;color:var(--ion);min-height:44px;font-weight:600;width:auto;padding:8px 6px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.topbar{position:absolute;top:0;left:0;right:0;z-index:3;padding:16px 16px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.topbar>*{pointer-events:auto}
.sky{display:grid;gap:3px;height:10px;align-items:center}
.sky i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14);justify-self:center;transition:transform .3s,background .3s,box-shadow .3s}
.sky i.on{background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.7);transform:scale(1.25)}
.sky i.on.solar{background:var(--solar);box-shadow:0 0 8px 2px rgba(255,179,71,.8)}
.prog{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog b{color:var(--text);font-weight:600}
.pbar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ion),var(--solar));border-radius:2px;transition:width .35s}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.35;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.opt:hover{background:rgba(255,255,255,.09)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--solar);background:rgba(255,179,71,.14)}
.opt .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.opt .tx{flex:1}
.opt.mini{padding:11px 12px;font-size:15px}
.opt.mini .ic{width:32px;height:32px;font-size:18px;border-radius:9px}
.opt.kid{padding:18px 16px;font-size:19px;border-radius:20px;min-height:84px}
.opt.kid .ic{width:56px;height:56px;font-size:32px;border-radius:16px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex:none}
.opt.sel .chk{border-color:var(--solar);background:var(--solar);box-shadow:inset 0 0 0 4px var(--sky-0)}
.qtext{font-family:var(--f-display);font-weight:500;font-size:21px;line-height:1.28;margin:6px 0 18px;letter-spacing:-.005em}
.qtext.kid{font-size:24px;line-height:1.25;margin:8px 0 20px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 10px}
.scale.kid3{grid-template-columns:repeat(3,1fr);gap:10px}
.scale button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:14px;padding:10px 2px 8px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;font-family:var(--f-body)}
.scale.kid3 button{min-height:104px;border-radius:20px;padding:14px 6px;gap:8px}
.scale button span.e{font-size:24px;line-height:1}
.scale.kid3 button span.e{font-size:38px}
.scale button span.n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scale.kid3 button span.n{font-family:var(--f-body);font-size:13px;text-align:center;line-height:1.2}
.scale button.sel{border-color:var(--solar);background:rgba(255,179,71,.16)}
.scale-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:18px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:16px}
.card.solar{background:linear-gradient(135deg,rgba(255,179,71,.18),rgba(92,225,255,.10));border-color:rgba(255,179,71,.35)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px;font-weight:600;color:var(--muted)}
.chip.ion{background:rgba(92,225,255,.15);color:var(--ion)}
.chip.solar{background:rgba(255,179,71,.18);color:var(--solar)}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.name-in{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--text);font-size:17px;font-family:var(--f-body)}
.name-in::placeholder{color:rgba(255,255,255,.35)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{padding:16px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--text);font-family:var(--f-body);font-size:17px;font-weight:700;cursor:pointer}
.seg button.sel{border-color:var(--ion);background:rgba(92,225,255,.14)}
.seg button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.seg.big button{padding:20px 12px;font-size:18px;border-radius:20px;line-height:1.25}
.seg.big button em{display:block;font-style:normal;font-size:34px;margin-bottom:8px;line-height:1}
.seg.big button small{margin-top:6px;line-height:1.3}
.seg.big button small+small{margin-top:4px;opacity:.8}
.seg.big.three{grid-template-columns:1fr}
.seg.big.three button{display:grid;grid-template-columns:52px 1fr;gap:0 14px;align-items:center;text-align:left;padding:16px 16px}
.seg.big.three button em{grid-row:1/4;font-size:36px;margin:0;align-self:center}
.seg.big.three button small{grid-column:2}
@container app (min-width:720px){.seg.big.three{grid-template-columns:repeat(3,1fr)}
  .seg.big.three button{display:block;text-align:center;padding:22px 14px}
  .seg.big.three button em{display:block;margin-bottom:8px}}
.tracklist{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:28px 1fr 46px;gap:10px;align-items:center}
.trow.nopc{grid-template-columns:28px 1fr}
.trow .tb{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.trow .tb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ion),var(--solar));width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.trow .pc{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.trow .tn{font-size:14px;font-weight:600}
.trow .tn small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:10px 0 10px 40px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;line-height:1.4}
.steps li:last-child{border-bottom:0}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:9px;width:28px;height:28px;border-radius:50%;background:var(--solar);color:#1A1200;font-family:var(--f-display);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps li em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.steps.kid li{font-size:16px;padding:12px 0 12px 42px}
.olist{list-style:none;margin:0;padding:0}
.olist li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.35}
.olist li:last-child{border-bottom:0}
.olist li.dim{opacity:.55}
.olist .on{font-weight:600}
.olist .ow{grid-column:1/-1;font-size:12px;color:var(--muted)}
.olist .og{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;align-self:start;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08)}
.olist li.fit .og{color:var(--solar);background:rgba(255,179,71,.14)}
.flip{perspective:900px}
.flip .inner{animation:flipin .9s cubic-bezier(.2,.8,.2,1) both;transform-style:preserve-3d}
@keyframes flipin{from{transform:rotateY(90deg);opacity:0}to{transform:rotateY(0);opacity:1}}
.fade{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.planet{position:relative;width:170px;height:170px;margin:10px auto 18px;perspective:700px}
.planet .core{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD59A,var(--solar) 45%,#8A4A12 100%);box-shadow:0 0 40px rgba(255,179,71,.45)}
.planet .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(92,225,255,.55);transform-style:preserve-3d;animation:spin 9s linear infinite}
.planet .ring.r2{inset:7%;border-color:rgba(255,255,255,.35);animation:spin2 14s linear infinite}
.planet .ring.r3{inset:14%;border-color:rgba(255,179,71,.5);animation:spin3 11s linear infinite}
.planet .ring:after{content:"";position:absolute;top:-5px;left:50%;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
@keyframes spin{from{transform:rotateX(70deg) rotateZ(0)}to{transform:rotateX(70deg) rotateZ(360deg)}}
@keyframes spin2{from{transform:rotateX(60deg) rotateY(30deg) rotateZ(360deg)}to{transform:rotateX(60deg) rotateY(30deg) rotateZ(0)}}
@keyframes spin3{from{transform:rotateX(80deg) rotateY(-40deg) rotateZ(0)}to{transform:rotateX(80deg) rotateY(-40deg) rotateZ(360deg)}}
.constel{display:block;margin:0 auto;width:210px;height:190px}
.constel line{stroke:var(--ion);stroke-width:1.4;stroke-linecap:round;opacity:.9}
.constel circle{fill:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
.constel.draw line{stroke-dasharray:140;stroke-dashoffset:140;animation:dash 1.4s ease forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.radar{display:block;margin:4px auto;width:300px;max-width:100%;height:230px}
.radar .grid{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1}
.radar .axis{stroke:rgba(255,255,255,.18);stroke-width:1}
.radar .poly{fill:rgba(92,225,255,.28);stroke:var(--ion);stroke-width:2;transform-origin:150px 115px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
.radar text{font-family:var(--f-body);font-size:12px;fill:var(--text);font-weight:600}
.radar text.v{font-family:var(--f-mono);font-size:11px;fill:var(--muted);font-weight:400}
.radar text.weak{fill:var(--solar)}
.flystar{position:absolute;z-index:9;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.8);pointer-events:none}
.toast{position:absolute;left:16px;right:16px;bottom:18px;z-index:12;background:#fff;color:#111;border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fadeup .25s ease both;max-width:640px;margin:0 auto}
.toast.dark{background:var(--sky-3);color:var(--text)}
.toast .x{float:right;border:0;background:transparent;font-size:18px;cursor:pointer;color:inherit;line-height:1}
.fb{display:flex;flex-direction:column;gap:12px}
.fb .q{font-size:15px;font-weight:600;margin-bottom:6px}
.fb .o{display:flex;gap:6px}
.fb .o button{flex:1;min-height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--text);font-family:var(--f-body);font-size:14px;cursor:pointer}
.fb .o button.sel{border-color:var(--ion);background:rgba(92,225,255,.16)}
.footlinks{display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.app .demo{border:1px dashed rgba(255,255,255,.25);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:10px}
.build-lines p{opacity:0;animation:fadeup .4s ease forwards}
.build-lines p:nth-child(1){animation-delay:.2s}
.build-lines p:nth-child(2){animation-delay:1.2s}
.build-lines p:nth-child(3){animation-delay:2.2s}
.kv{background:rgba(255,255,255,.05);border-radius:14px;padding:12px;margin-bottom:10px}
.kv .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.kv .v{font-size:14px;font-weight:600;line-height:1.35}
.kv .v small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:3px}
.app .f{font-family:var(--f-mono);font-size:12px;background:rgba(255,255,255,.06);padding:8px 10px;border-radius:10px;white-space:pre-wrap;line-height:1.5;overflow-x:auto}
.app ul{padding-left:18px;margin:0 0 10px;font-size:15px}
.app ul li{margin:3px 0}
.app ol{padding-left:20px;margin:0 0 10px;font-size:15px}
.app .back{position:absolute;top:14px;left:12px;z-index:4}
.hero-art{text-align:center}
.hero-txt{text-align:center}
.r-sec{margin-top:18px}
.grown{background:rgba(92,225,255,.08);border:1px solid rgba(92,225,255,.25);border-radius:16px;padding:14px}
.grown .eyebrow{color:var(--ion)}

@media (prefers-reduced-motion: reduce){

.mob-bar{display:none}

.pdoc .pbrand{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#E0731C;font-weight:700}
.pdoc .pmeta{color:#555}
.pdoc .pgroup{font-size:12px;color:#666}
.pdoc .ptwo{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:start}
.pdoc .pvis{text-align:center}
.pdoc .constel{width:200px;height:180px}
.pdoc .constel line{stroke:#1E3A8A;stroke-width:1.6;stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.pdoc .constel circle{fill:#1E3A8A;filter:none}
.pdoc .radar{width:230px;height:130px}
.pdoc .radar .grid,.pdoc .radar .axis{stroke:#bbb;fill:none}
.pdoc .radar .poly{fill:rgba(224,115,28,.25);stroke:#E0731C;animation:none}
.pdoc .radar text{fill:#111;font-size:10px}
.pdoc .radar text.v{fill:#666}
.pdoc .radar text.weak{fill:#E0731C;font-weight:700}
.pdoc .pnote{background:#F4F5F9;border-radius:6px;padding:8px 10px;font-size:11.5px;color:#333;margin-top:10px}
.pdoc .pfoot{margin-top:12px;font-size:10.5px;color:#666;border-top:1px solid #ddd;padding-top:6px}
.pdoc .pbreak{height:0}
.pdoc .ptbl{border-collapse:collapse;width:100%}
.pdoc .ptbl td{border-bottom:1px solid #ddd;padding:4px 6px}
.pdoc.poster{text-align:center;padding-top:30px}
.pdoc.poster h1{font-size:30px}
.pdoc.poster .big{font-size:18px;max-width:560px;margin:14px auto}
.pdoc.poster .pqr{width:330px;height:330px;margin:20px auto}
.pdoc.poster .pqr svg{width:100%;height:100%}
@media print{
  #printSheet .pdoc{width:auto;max-width:180mm;margin:0 auto}
  #printSheet .pbreak{page-break-before:always;break-before:page}
}

const AUDS = DATA.meta.audiences.map(a=>a.key);

function totalSteps(aud){ const t=tree(aud); return t.q.length + 1 + t.st.length; }

/* ===================== ГОРОД ===================== */
function normCity(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/^\s*(г\.|город|гор\.)\s*/,'').replace(/[«»"']/g,'').replace(/\s+/g,' ').trim(); }
function cityInfo(school, raw){
  if(school==='itsh') return {spb:true, name:'Санкт-Петербург'};
  const n=normCity(raw); if(!n) return {spb:false, name:'', known:null};
  if(DATA.spbAliases.includes(n)) return {spb:true, name:'Санкт-Петербург'};
  const c=DATA.cities.find(c=>c.aliases.includes(n) || normCity(c.name)===n);
  return {spb:false, name:c?c.name:String(raw).trim(), known:c||null};
}

/* ===================== ПОДСЧЁТ ===================== */
function weightFor(opt,t){ return opt.p===t?2:(opt.s===t?1:0); }
const MAXP = {};
for(const a of AUDS){ const T=tree(a); MAXP[a]={}; for(const tr of DATA.tracks) MAXP[a][tr.id]=T.q.reduce((m,q)=>m+Math.max(...q.options.map(o=>weightFor(o,tr.id))),0)+T.f.bonus; }
function rankTracks(aud,answers,picks){
  const T=tree(aud); const s=Object.fromEntries(DATA.tracks.map(t=>[t.id,0]));
  T.q.forEach((q,i)=>{ const oi=answers[i]; if(oi==null) return; const o=q.options[oi]; s[o.p]+=2; s[o.s]+=1; });
  picks.forEach(p=>{ s[p]+=T.f.bonus; });
  return DATA.tracks.map(t=>({id:t.id,score:s[t.id],match:Math.round(100*s[t.id]/MAXP[aud][t.id])}))
    .sort((a,b)=> b.match-a.match || b.score-a.score || ((picks.includes(a.id)?0:1)-(picks.includes(b.id)?0:1)) || a.id-b.id);
}
function skillAverages(aud,values){
  const T=tree(aud); const acc={T:[],D:[],M:[],K:[]};
  T.st.forEach((st,i)=>{ if(values[i]!=null) acc[st.block].push(values[i]); });
  const avg={}; for(const b of BLOCKS_ORDER){ const a=acc[b]; avg[b]=a.length?Math.round(10*a.reduce((x,y)=>x+y,0)/a.length)/10:0; }
  return avg;
}
function engineerType(avg){
  const r=DATA.typeRules, vals=BLOCKS_ORDER.map(b=>avg[b]), mx=Math.max(...vals), mn=Math.min(...vals);
  if(mx<r.starterMax) return 'starter';
  if(mx-mn<=r.universalSpread && mn>=r.universalMin) return 'universal';
  const order=[...BLOCKS_ORDER].sort((a,b)=> avg[b]-avg[a] || BLOCKS_ORDER.indexOf(a)-BLOCKS_ORDER.indexOf(b));
  return r.pairMap[[order[0],order[1]].sort((a,b)=>BLOCKS_ORDER.indexOf(a)-BLOCKS_ORDER.indexOf(b)).join('+')];
}
function weakest(avg,keys){ let best=keys[0]; for(const b of keys) if(avg[b]<avg[best]) best=b; return best; }
function levelOf(v){ return v>=3.8?{k:'hi',t:'сильная сторона'}:(v>=2.5?{k:'mid',t:'развивается'}:{k:'lo',t:'зона роста'}); }

  return track.olympiads.map(id=>DATA.olympiads[id]).map(o=>({...o,fit:fits(o,grade)}))

}
function regionalOlympiads(track,grade,ci){
  if(!ci.spb) return [];

}

const GCH='56789AB';
function b64u(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(s){ return decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))); }
function encodeResult(st){
  const fb=DATA.feedback.map(f=>st.fb[f.id]==null?'x':st.fb[f.id]).join('');
  let c='S4'+(st.aud==='teen'?'t':'m')+GCH[st.grade-5]+(st.school==='itsh'?'i':'a')+(st.before==null?'x':st.before)+
    st.answers.map(a=>a==null?'x':a).join('')+st.picks.map(id=>String.fromCharCode(96+id)).join('')+
    st.skills.map(v=>v==null?'x':v).join('')+fb;
  const extra={}; if(st.school!=='itsh'&&st.city) extra.c=st.city; if(st.klass) extra.k=st.klass;
  if(Object.keys(extra).length) c+='.'+b64u(JSON.stringify(extra));
  return c;
}
function decodeResult(str){
  try{
    str=String(str).trim(); const m=str.match(/S4[tm][5-9AB][ia][0-2x][0-9a-nx.A-Za-z_-]*/); if(!m) return null; str=m[0];
    const [body,ext]=str.split('.');
    const aud=body[2]==='t'?'teen':'mid', grade=GCH.indexOf(body[3])+5, school=body[4]==='i'?'itsh':'any', before=body[5]==='x'?null:+body[5];
    if(audOfGrade(grade)!==aud) return null;
    const T=tree(aud); let p=6;
    const answers=[...body.slice(p,p+T.q.length)].map(x=>x==='x'?null:+x); p+=T.q.length;
    const picks=[...body.slice(p,p+2)].map(ch=>ch.charCodeAt(0)-96); p+=2;
    const skills=[...body.slice(p,p+T.st.length)].map(x=>x==='x'?null:+x); p+=T.st.length;
    const fbs=body.slice(p,p+DATA.feedback.length);
    if(answers.length!==T.q.length||skills.length!==T.st.length||fbs.length!==DATA.feedback.length) return null;
    if(answers.some((a,i)=>a==null||!(a>=0&&a<T.q[i].options.length))) return null;
    if(picks.some(x=>!TR[x])||skills.some(v=>v==null||v<1||v>5)) return null;
    const fb={}; DATA.feedback.forEach((f,i)=>{ if(fbs[i]!=='x') fb[f.id]=+fbs[i]; });
    let extra={}; if(ext){ try{ extra=JSON.parse(unb64u(ext)); }catch(e){} }
    return {aud,grade,school,before,answers,picks,skills,fb,city:extra.c||'',klass:extra.k||'',code:str};
  }catch(e){ return null; }
}

function dashAdd(codes){
  let added=0, bad=0, dup=0;
  for(const c of codes){ const j=decodeResult(c); if(!j){ bad++; continue; } if(DASH.items.some(x=>x.code===j.code)){ dup++; continue; } DASH.items.push(j); added++; }
  dashSave(); return {added,bad,dup};
}

const SCAN={on:false,stream:null,raf:null,det:null,last:''};
function loadScript(srcs){ return new Promise((res,rej)=>{ const list=[].concat(srcs); const next=i=>{ if(i>=list.length) return rej(new Error('load')); const s=document.createElement('script'); s.src=list[i]; s.onload=()=>res(); s.onerror=()=>{ s.remove(); next(i+1); }; document.head.appendChild(s); }; next(0); }); }
async function scanStart(){
  try{
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){ toast('Нет доступа к камере. Разрешите камеру в браузере или добавьте результаты файлами.'); return; }
  if('BarcodeDetector' in window){ try{ SCAN.det=new BarcodeDetector({formats:['qr_code']}); }catch(e){ SCAN.det=null; } }
  if(!SCAN.det && !window.jsQR){ try{ await loadScript(['lib/jsqr.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js']); }catch(e){ toast('Не удалось загрузить модуль сканирования. Добавьте результаты файлами или ссылками.'); scanStop(); return; } }
  SCAN.on=true; render();
}
function scanAttach(){
  const v=document.getElementById('scanVideo'); if(!v||!SCAN.stream) return; v.srcObject=SCAN.stream; v.play().catch(()=>{});
  const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true}), msg=document.getElementById('scanMsg');
  const tick=async()=>{ if(!SCAN.on) return;
    if(v.readyState>=2){ let text='';
      try{ if(SCAN.det){ const r=await SCAN.det.detect(v); if(r[0]) text=r[0].rawValue; }
        else { c.width=v.videoWidth; c.height=v.videoHeight; ctx.drawImage(v,0,0); const img=ctx.getImageData(0,0,c.width,c.height); const r=window.jsQR(img.data,c.width,c.height); if(r) text=r.data; } }catch(e){}
      if(text && text!==SCAN.last){ SCAN.last=text; const r=dashAdd(extractCodes(text)); if(msg) msg.textContent=r.added?'✓ Добавлен результат. Всего: '+DASH.items.length:(r.dup?'Этот результат уже есть':'Это не QR результата «Созвездия»'); if(r.added){ if(navigator.vibrate) navigator.vibrate(60); setTimeout(()=>{ if(SCAN.on) render(); },700); return; } } }
    SCAN.raf=requestAnimationFrame(tick); };
  SCAN.raf=requestAnimationFrame(tick);
}
function scanStop(){ SCAN.on=false; cancelAnimationFrame(SCAN.raf); if(SCAN.stream) SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }

  document.getElementById('printSheet').innerHTML='<div class="pdoc poster"><div class="pbrand">Созвездие</div><h1>Конструктор компетенций будущего инженера</h1><p class="big">Наведи камеру телефона на код, пройди квиз за 5–10 минут и получи «Индивидуальный план развития инженерных компетенций»</p><div class="pqr">'+qrSVG(link,8)+'</div><p>'+esc(link)+'</p>'+(S.klass?'<p>Класс: '+esc(S.klass)+'</p>':'')+'<div class="pfoot">Проект ученика 7 класса ГБОУ «ИТШ № 777», Санкт-Петербург</div></div>';
  setTimeout(()=>{ try{ window.print(); }catch(e){} },80);
}
function dashPrint(){
  const s=dashStats(dashFiltered()), n=s.n;
  const tbl=(title,rows)=>'<h2>'+title+'</h2><table class="ptbl">'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+pct(r[1],n)+'%</td></tr>').join('')+'</table>';
  document.getElementById('printSheet').innerHTML='<div class="pdoc"><div class="pbrand">Созвездие · сводка по классу</div><h1>Результаты квиза: '+n+' участников</h1><p class="pmeta">'+(DASH.filterK?'Метка: '+esc(DASH.filterK)+' · ':'')+new Date().toLocaleDateString('ru-RU')+'</p>'+
    tbl('Инженерные направления',DATA.tracks.map(t=>[esc(t.name),s.tr[t.id]||0]).filter(r=>r[1]).sort((a,b)=>b[1]-a[1]))+
    tbl('Профессии',Object.entries(s.prof).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([p,v])=>[esc(p),v]))+
    tbl('Навыки для развития',[['Hard: Техника',s.hard.T],['Hard: Цифра',s.hard.D],['Soft: Мышление',s.soft.M],['Soft: Команда',s.soft.K]])+
    tbl('Обратная связь: «Помог ли сервис с профориентацией?»',DATA.feedback[2].options.map((o,i)=>[o,s.fb.orient[i]]))+'</div>';
  setTimeout(()=>{ try{ window.print(); }catch(e){} },80);
}

/* ===================== СОБЫТИЯ ===================== */
async function doShare(){
  const url=resultUrl(S), r=computeResult(S);
  const text='Мой «Индивидуальный план развития инженерных компетенций»: направление «'+r.top.name+'»';
  if(navigator.share){ try{ await navigator.share({title:'Созвездие — мой план',text,url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  copyText(url,'Ссылка на план скопирована — отправь её в мессенджере.');
}
function copyText(txt,okMsg){
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); toast(ok?okMsg:'Скопируйте: '+txt); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast(okMsg)).catch(fallback); }catch(e){ fallback(); }
}
view.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  const T=S.aud?tree(S.aud):null;
  if(b.dataset.aud){ startAud(b.dataset.aud); go('who'); return; }
  if(b.dataset.grade){ S.grade=+b.dataset.grade; keepInputs(); render(); return; }
  if(b.dataset.school){ S.school=b.dataset.school; keepInputs(); render(); if(S.school==='any'){ const c=document.getElementById('cityIn'); if(c&&!S.city) c.focus(); } return; }
  if(b.dataset.before!=null){ S.before=+b.dataset.before; keepInputs(); render(); return; }
  if(b.dataset.opt!=null){ S.answers[S.qi]=+b.dataset.opt; b.classList.add('sel'); flyStar(b);
    setTimeout(()=>{ if(S.qi<T.q.length-1){S.qi++; go('track');} else go('pick'); }, REDUCED?60:360); return; }
  if(b.dataset.pick!=null){ const t=+b.dataset.pick;
    if(S.picks.includes(t)) S.picks=S.picks.filter(x=>x!==t); else if(S.picks.length<T.f.pickCount) S.picks.push(t);
    const sc=view.scrollTop; render(); view.scrollTop=sc; if(S.picks.length===T.f.pickCount) flyStar(b); return; }
  if(b.dataset.val!=null){ S.skills[S.si]=+b.dataset.val; b.classList.add('sel'); flyStar(b);
    setTimeout(()=>{ if(S.si<T.st.length-1){S.si++; go('skills');} else { go('building'); startBuilding(); } }, REDUCED?60:320); return; }
  if(b.dataset.fb){ S.fb[b.dataset.fb]=+b.dataset.fbv; const sc=view.scrollTop; render(); view.scrollTop=sc; return; }
  switch(b.dataset.act){
    case 'start': go('aud'); break;
    case 'back-start': go('start'); break;
    case 'back-aud': go('aud'); break;
    case 'about': go('about'); break;
    case 'teacher': go('teacher'); break;
    case 'dashboard': dashLoad(); go('dashboard'); break;
    case 'parent': go('parent'); break;
    case 'back-result': go('result'); break;
    case 'back-home': scanStop(); go(isDone()?'result':'start'); break;
    case 'who-next': keepInputs(); if(S.grade&&S.school&&(S.school!=='any'||normCity(S.city))&&S.before!=null){ S.qi=0; go('track'); } break;
    case 'track-back': if(S.qi>0){ S.answers[S.qi]=null; S.qi--; S.answers[S.qi]=null; go('track'); } else go('who'); break;
    case 'pick-next': if(S.picks.length===T.f.pickCount) go('inter'); break;
    case 'pick-back': S.picks=[]; S.qi=T.q.length-1; S.answers[S.qi]=null; go('track'); break;
    case 'inter-next': S.si=0; go('skills'); break;
    case 'skill-back': if(S.si>0){ S.skills[S.si]=null; S.si--; S.skills[S.si]=null; go('skills'); } else go('inter'); break;
    case 'restart': resetQuiz(); history.replaceState(null,'',location.pathname+location.search); go('start'); break;
    case 'pdf': doPDF(); break;
    case 'share': doShare(); break;
    case 'send': resultFile(); go('send'); break;
    case 'dl-result': resultFile(); break;
    case 'copy-link': copyText(resultUrl(S),'Ссылка на результат скопирована — отправь её учителю.'); break;
    case 'myqr': go('myqr'); break;
    case 'fb-send': S.fbSent=true; { const sc=view.scrollTop; render(); view.scrollTop=sc; } toast('Спасибо! Ответы добавлены в результат.'); break;
    case 'poster': doPoster(); break;
    case 'copy-class': copyText(baseUrl()+(S.klass?'?k='+encodeURIComponent(S.klass):''),'Ссылка на квиз скопирована.'); break;
    case 'scan': if(SCAN.on){ scanStop(); render(); } else scanStart(); break;
    case 'paste': { const v=document.getElementById('dPaste').value; const r=dashAdd(extractCodes(v)); render(); toast('Добавлено: '+r.added+(r.dup?' · повторов: '+r.dup:'')+(r.bad?' · не распознано: '+r.bad:'')+(!r.added&&!r.dup&&!r.bad?' · ссылок не найдено':'')); } break;
    case 'csv': dashCSV(); break;
    case 'dash-json': download('sozvezdie-vse-rezultaty.json',JSON.stringify({app:'sozvezdie',v:4,codes:dashFiltered().map(x=>x.code)},null,1),'application/json'); break;
    case 'dash-print': dashPrint(); break;
    case 'dash-clear': if(confirm('Удалить все результаты из дашборда на этом устройстве?')){ DASH.items=[]; dashSave(); render(); } break;
  }
});
function keepInputs(){ const n=document.getElementById('nameIn'); if(n) S.name=n.value.trim().slice(0,20); const c=document.getElementById('cityIn'); if(c) S.city=c.value.trim().slice(0,40); }
view.addEventListener('input', e=>{
  if(e.target.id==='nameIn') S.name=e.target.value;
  if(e.target.id==='cityIn'){ S.city=e.target.value; const ci=cityInfo('any',S.city), h=document.getElementById('cityHint'), g=document.getElementById('goBtn'), gh=document.getElementById('goHint');
    if(h) h.textContent=!normCity(S.city)?'Город нужен, чтобы подобрать кружки, вузы и колледжи рядом. Всероссийские олимпиады покажем всем.':(ci.spb?'Санкт-Петербург — покажем кружки, вузы и колледжи города.':(ci.known?'Нашли: '+ci.known.name+' — добавим вузы города.':'Такого города пока нет в нашей базе — покажем федеральные вузы и подскажем, где искать в твоём регионе.'));
    const ready=S.grade&&S.school&&normCity(S.city)&&S.before!=null; if(g) g.disabled=!ready; if(gh) gh.textContent=ready?'':'Выбери класс, школу, напиши город и ответь на вопрос'; }
  if(e.target.id==='klassIn'){ S.klass=e.target.value.trim().slice(0,24); const box=document.getElementById('classQR'); if(box) box.innerHTML=qrSVG(baseUrl()+(S.klass?'?k='+encodeURIComponent(S.klass):''),5); }
});
function startBuilding(){ setTimeout(()=>{ if(S.screen==='building') go('result'); }, REDUCED?600:2600); }
function toast(msg){ const old=appEl.querySelector('.toast'); if(old) old.remove();
  const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.innerHTML='<button class="x" aria-label="Закрыть">×</button>'+esc(msg);
  appEl.appendChild(t); t.querySelector('.x').onclick=()=>t.remove(); setTimeout(()=>{ if(t.parentNode) t.remove(); },6000); }

/* ---- Звёздное небо ---- */
(function(){
  const c=document.getElementById('stars'), ctx=c.getContext('2d'); let W=0,H=0,stars=[],raf=null,t0=performance.now();
  function size(){ const r=appEl.getBoundingClientRect();
    W=c.width=Math.max(1,Math.floor(r.width*devicePixelRatio)); H=c.height=Math.max(1,Math.floor(r.height*devicePixelRatio));
    const n=Math.round(140*Math.max(1,r.width/400));
    stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.4+.4)*devicePixelRatio,p:Math.random()*Math.PI*2,s:Math.random()*.6+.3,d:Math.random()*.15+.03})); }
  function draw(now){ const t=(now-t0)/1000, g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#070A1C'); g.addColorStop(1,'#101748'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(const s of stars){ ctx.globalAlpha=.35+.65*Math.abs(Math.sin(t*s.s+s.p)); ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(s.x,(s.y+t*s.d*devicePixelRatio*4)%H,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1; if(!REDUCED&&!document.hidden) raf=requestAnimationFrame(draw); }
  size(); if(REDUCED) draw(t0); else raf=requestAnimationFrame(draw);
  new ResizeObserver(()=>{ size(); if(REDUCED) draw(performance.now()); }).observe(appEl);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!REDUCED&&!raf) raf=requestAnimationFrame(draw); if(document.hidden){ cancelAnimationFrame(raf); raf=null; } });
})();
window.addEventListener('afterprint',()=>{ document.getElementById('printSheet').innerHTML=''; });

function route(){
  const mh=location.hash.match(/r=([A-Za-z0-9_.-]+)/);
  if(mh){ const j=decodeResult(mh[1]); if(j){ Object.assign(S,{aud:j.aud,grade:j.grade,school:j.school,before:j.before,answers:j.answers,picks:j.picks,skills:j.skills,fb:j.fb,city:j.city,klass:j.klass,fbSent:Object.keys(j.fb).length===DATA.feedback.length,fromLink:true,screen:'result'}); } }
  else if(/dashboard/.test(location.hash)){ dashLoad(); S.screen='dashboard'; }
  else if(/teacher/.test(location.hash)){ S.screen='teacher'; }
  render();
}
window.addEventListener('hashchange',route);
route();
